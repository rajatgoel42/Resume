<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Housing Loan Application Portal</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { max-width: 800px; margin: auto; }
    label { display: block; margin-top: 10px; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; }
    button { margin-top: 15px; padding: 10px 20px; }
    #agreement { margin-top: 30px; padding: 20px; border: 1px solid #ccc; background: #f9f9f9; white-space: pre-wrap; }
  </style>
</head>
<body>
<a href="https://github.com/rajatgoel42/"></a>
<a href="https://rajatgoel42.github.io/Resume/"></a>
<div class="container">
  <h1>Housing Loan Application Form</h1>
  <form id="loanForm">
    <h3>Personal Information</h3>
    <label for="fullName">Full Name:</label>
    <input type="text" id="fullName" required />

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" required />

    <label for="address">Address:</label>
    <textarea id="address" required></textarea>

    <h3>Employment & Income</h3>
    <label for="employment">Employment Type:</label>
    <select id="employment" required>
      <option value="Salaried">Salaried</option>
      <option value="Self-Employed">Self-Employed</option>
    </select>

    <label for="income">Monthly Income ($):</label>
    <input type="number" id="income" required />

    <h3>Loan Details</h3>
    <label for="loanAmount">Loan Amount ($):</label>
    <input type="number" id="loanAmount" required />

    <label for="loanTenure">Loan Tenure (Years):</label>
    <input type="number" id="loanTenure" required />

    <button type="button" onclick="generateAgreement()">Generate Loan Agreement</button>
  </form>

  <div id="agreement">
    <h2>Loan Agreement Preview</h2>
    <div id="agreementText">Fill the form to generate the agreement.</div>
  </div>
</div>

<script>
  function generateAgreement() {
    const fullName = document.getElementById("fullName").value;
    const dob = document.getElementById("dob").value;
    const address = document.getElementById("address").value;
    const employment = document.getElementById("employment").value;
    const income = document.getElementById("income").value;
    const loanAmount = document.getElementById("loanAmount").value;
    const loanTenure = document.getElementById("loanTenure").value;

    const agreement = `
HOUSING LOAN AGREEMENT

This Loan Agreement is made on ${new Date().toLocaleDateString()} between:

Borrower Name: ${fullName}
Date of Birth: ${dob}
Address: ${address}
Employment Type: ${employment}
Monthly Income: $${income}

Loan Details:
- Loan Amount: $${loanAmount}
- Loan Tenure: ${loanTenure} years
- Estimated Monthly EMI: $${calculateEMI(loanAmount, loanTenure)}

The Borrower agrees to repay the loan as per the agreed schedule with the lending institution.

Signature of Borrower: ____________________________

Date: ${new Date().toLocaleDateString()}
    `;

    document.getElementById("agreementText").innerText = agreement;
  }

  function calculateEMI(principal, years) {
    const annualRate = 0.08; // example 8% interest rate
    const monthlyRate = annualRate / 12;
    const n = years * 12;
    const emi = (principal * monthlyRate * Math.pow(1 + monthlyRate, n)) / (Math.pow(1 + monthlyRate, n) - 1);
    return emi.toFixed(2);
  }
</script>

</body>
</html>
